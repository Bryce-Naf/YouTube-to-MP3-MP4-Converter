steps:
  # Build the backend Docker image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/app-backend
      - .

  # Push the image to Container Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/app-backend

  # Deploy to Cloud Run.
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - app-backend
      - --image
      - gcr.io/$PROJECT_ID/app-backend
      - --platform
      - managed
      - --region
      - us-central1
      # Enables public access; add auth and request controls before production.
      - --allow-unauthenticated
      - --port
      - "8080"
      - --timeout
      - 1860s

options:
  logging: CLOUD_LOGGING_ONLY
