<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Enter a URL to get started.">
    <title>Media URL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Media tools</p>
      <h1>Enter a URL</h1>
      <label for="media-url">YouTube URL</label>
      <input
        id="media-url"
        name="url"
        type="url"
        inputmode="url"
        autocomplete="url"
        placeholder="https://www.youtube.com/watch?v=..."
      >
    </main>
  </body>
</html>
